/**:
  ros__parameters:
    dataInfo:

      camera:
        color:
          # ZED Mini external RGB (compressed) + left wrist D405 rectified RGB.
          # Depth/fisheye are recorded for audit but not used by π0.5 training.
          names:
            - zedExternalRgb
            - leftWristD405
            - pikaGripperDepthCamera_l
            - pikaGripperFisheyeCamera_l
          parentFrames:
            - zed_left_camera_optical_frame
            - gripper/camera_l_link
            - gripper/camera_l_link
            - gripper/camera_fisheye_l_link
          topics:
            - /external/zed_node/rgb/color/rect/image/compressed
            - /gripper/camera_l/color/image_rect_raw/compressed
            - /gripper/camera_l/color/image_raw
            - /gripper/camera_fisheye_l/color/image_raw
          configTopics:
            - /external/zed_node/rgb/color/rect/camera_info
            - /gripper/camera_l/color/camera_info
            - /gripper/camera_l/color/camera_info
            - /gripper/camera_fisheye_l/color/camera_info
        depth:
          names: ['pikaGripperDepthCamera_l']
          parentFrames: ['gripper/camera_l_link']
          topics: ['/gripper/camera_l/aligned_depth_to_color/image_raw']
          configTopics: ['/gripper/camera_l/aligned_depth_to_color/camera_info']

      arm:
        jointState:
          # Feedback is state. Control is the absolute action source and MUST
          # be recorded. Control messages arrive as separate partial JointState
          # publishes (joint1..7 from IK, gripper from pub_delta_pose).
          names:
            - leftArmJointStateFeedback
            - leftArmJointStateControl
          topics:
            - /left_arm/feedback/joint_states
            - /left_arm/control/joint_states
        endPose:
          names: ['leftArmEndPose']
          topics: ['/left_arm/feedback/tcp_pose']
          orients: [true]

      localization:
        pose:
          names: ['pika_l']
          topics: ['/pika_pose_l']

      gripper:
        encoder:
          names: ['pikaSensor_l', 'pikaGripper_l']
          topics: ['/sensor/gripper_l/data', '/gripper/gripper_l/data']

      instruction:
        text:
          names: ['instruction']
          topics: ['/instruction']
